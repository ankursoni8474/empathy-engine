<!DOCTYPE html>
<html>
<head>
    <title>Empathy Engine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 12px;
            width: 500px;
            margin: auto;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
        }

        audio {
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ Empathy Engine</h1>

        <form method="POST">
            <textarea name="text" rows="4" placeholder="Enter your text here..."></textarea>
            <br>
            <button type="submit">Generate Speech</button>
        </form>

        {% if audio %}
        <div class="result">
            <h3>Detected Emotion: {{ emotion }}</h3>
            <audio controls>
                <source src="{{ url_for('static', filename='output.mp3') }}" type="audio/mpeg">
            </audio>
        </div>
        {% endif %}
    </div>

</body>
</html>
